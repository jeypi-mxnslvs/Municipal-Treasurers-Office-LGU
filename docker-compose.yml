version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: santa_rosa_rptas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rptas_treasury
      POSTGRES_USER: treasury_admin
      POSTGRES_PASSWORD: santa_rosa_local_secure_password_2026!
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury_admin -d rptas_treasury"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: postgrest/postgrest:v12.2.0
    container_name: santa_rosa_rptas_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://treasury_admin:santa_rosa_local_secure_password_2026!@postgres:5432/rptas_treasury
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: treasury_admin
      PGRST_SERVER_PORT: 3000
    ports:
      - "3000:3000"

  web:
    image: nginx:alpine
    container_name: santa_rosa_rptas_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
    driver: local
